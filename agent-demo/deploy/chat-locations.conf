location = /chat { return 302 /chat/; }
location = /.well-known/agent-card.json {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    access_log off;
}
location /chat/ {
    if ($host = www.wikshi.xyz) { return 308 https://wikshi.xyz$request_uri; }
    alias /var/www/wikshi-chat/current/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
}
location /chat-api/ {
    limit_req zone=wikshi_chat burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    access_log off;
}
